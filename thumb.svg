<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Fondo oscuro del portafolio -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f12"/>
      <stop offset="100%" stop-color="#161c22"/>
    </linearGradient>
    
    <!-- Grid sutil como en el hero -->
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0L0 0 0 72" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    
    <!-- Glow para elementos destacados -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Mask radial para fade del grid (como en el hero) -->
    <radialGradient id="gridMask" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Fondo base -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)" mask="url(#gridMask)"/>
  
  <!-- Glows sutiles -->
  <circle cx="150" cy="180" r="200" fill="rgba(163,230,53,0.06)" filter="blur(80px)"/>
  <circle cx="1050" cy="500" r="250" fill="rgba(163,230,53,0.04)" filter="blur(90px)"/>
  
  <!-- Contenedor tipo ventana terminal -->
  <rect x="120" y="110" width="960" height="455" rx="16" fill="#161c22" stroke="#2a3340" stroke-width="1.5"/>
  
  <!-- Barra superior de terminal (con dots macOS-style) -->
  <rect x="120" y="110" width="960" height="40" rx="16" fill="#1e2630"/>
  <rect x="120" y="134" width="960" height="16" fill="#1e2630"/>
  <circle cx="148" cy="130" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="168" cy="130" r="6" fill="#eab308" opacity="0.8"/>
  <circle cx="188" cy="130" r="6" fill="#22c55e" opacity="0.8"/>
  <text x="600" y="135" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" text-anchor="middle" fill="#64748b">~/darwin.dev — portafolio</text>
  
  <!-- Contenido principal -->
  <g transform="translate(600, 240)">
    <!-- Prompt grande -->
    <text x="-360" y="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="72" font-weight="700" fill="#8a9aa8">&gt;_</text>
    
    <!-- Nombre -->
    <text x="-180" y="10" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#e8edf2" letter-spacing="-0.02em">Darwin</text>
  </g>
  
  <text x="600" y="310" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="72" font-weight="800" text-anchor="middle" fill="#b0c4d9" letter-spacing="-0.02em">Colmenares</text>
  
  <!-- Subtítulo con acento verde -->
  <g transform="translate(600, 365)" text-anchor="middle">
    <rect x="-280" y="-28" width="560" height="44" rx="22" fill="rgba(163,230,53,0.08)" stroke="rgba(163,230,53,0.3)" stroke-width="1"/>
    <text x="0" y="0" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="26" font-weight="600" fill="#a3e635" letter-spacing="-0.01em">Full-Stack Developer &amp; Data Analyst</text>
  </g>
  
  <!-- Tagline descriptiva -->
  <text x="600" y="425" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#8a9aa8">
    Contador Público · Ingeniero Informático · Caracas, VE
  </text>
  
  <!-- Stack en formato "prompt" -->
  <g transform="translate(600, 480)" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#b0c4d9">
    <!-- Primera línea -->
    <text x="-360" y="0" fill="#8a9aa8">$</text>
    <text x="-340" y="0">python</text>
    <text x="-270" y="0" fill="#a3e635">◆</text>
    <text x="-250" y="0">laravel</text>
    <text x="-160" y="0" fill="#a3e635">◆</text>
    <text x="-140" y="0">react</text>
    <text x="-80" y="0" fill="#a3e635">◆</text>
    <text x="-60" y="0">typescript</text>
    <text x="35" y="0" fill="#a3e635">◆</text>
    <text x="55" y="0">django</text>
    <text x="120" y="0" fill="#a3e635">◆</text>
    <text x="140" y="0">node.js</text>
    <text x="210" y="0" fill="#a3e635">◆</text>
    <text x="230" y="0">angular</text>
    
    <!-- Segunda línea -->
    <text x="-360" y="28" fill="#8a9aa8">$</text>
    <text x="-340" y="28">powerbi</text>
    <text x="-250" y="28" fill="#a3e635">◆</text>
    <text x="-230" y="28">dax</text>
    <text x="-185" y="28" fill="#a3e635">◆</text>
    <text x="-165" y="28">pandas</text>
    <text x="-90" y="28" fill="#a3e635">◆</text>
    <text x="-70" y="28">postgresql</text>
    <text x="40" y="28" fill="#a3e635">◆</text>
    <text x="60" y="28">mongodb</text>
    <text x="150" y="28" fill="#a3e635">◆</text>
    <text x="170" y="28">docker</text>
    <text x="235" y="28" fill="#a3e635">◆</text>
    <text x="255" y="28">linux</text>
  </g>
  
  <!-- Footer con CTA -->
  <g transform="translate(600, 580)">
    <rect x="-260" y="-22" width="520" height="44" rx="22" fill="#a3e635"/>
    <text x="0" y="6" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0b0f12" letter-spacing="0.02em">✦ Trabajemos juntos · darwinjcn.github.io</text>
  </g>
  
  <!-- Esquinas decorativas estilo bracket (coherentes con el portafolio) -->
  <g stroke="#a3e635" stroke-width="2" fill="none" opacity="0.6">
    <path d="M60 60 L100 60 L100 100"/>
    <path d="M1140 60 L1100 60 L1100 100"/>
    <path d="M60 615 L100 615 L100 575"/>
    <path d="M1140 615 L1100 615 L1100 575"/>
  </g>
  
  <!-- Detalles de código flotantes (decorativos) -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#2a3340" opacity="0.6">
    <text x="40" y="40">#!/usr/bin/env python3</text>
    <text x="40" y="640">© 2026 · Caracas, VE</text>
    <text x="960" y="40">v2.0 · live</text>
    <text x="1000" y="640">git@darwin.dev</text>
  </g>
</svg>
