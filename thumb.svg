<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0L0 0 0 60" fill="none" stroke="rgba(59,130,246,0.08)" stroke-width="1"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="200" cy="150" r="180" fill="rgba(96,165,250,0.15)" filter="blur(50px)"/>
  <circle cx="1050" cy="480" r="220" fill="rgba(168,85,247,0.12)" filter="blur(60px)"/>
  <circle cx="600" cy="550" r="150" fill="rgba(244,114,182,0.08)" filter="blur(45px)"/>
  <rect x="100" y="100" width="1000" height="475" rx="28" fill="rgba(20,30,55,0.85)" stroke="rgba(59,130,246,0.5)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="120" width="960" height="3" rx="1.5" fill="url(#accent)" opacity="0.7"/>
  <g transform="translate(560, 195)">
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="url(#accent)" opacity="0.2"/>
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="none" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="0" y="8" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="36" font-weight="800" text-anchor="middle" fill="url(#accent)">D</text>
  </g>
  <text x="600" y="300" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="52" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-0.02em">Darwin Colmenares</text>
  <rect x="450" y="325" width="300" height="2" rx="1" fill="url(#accent)" opacity="0.8"/>
  <text x="600" y="380" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="url(#nameGrad)" letter-spacing="-0.01em">Full-Stack Developer</text>
  <text x="600" y="420" font-family="Outfit, Segoe UI, system-ui, sans-serif" font-size="24" font-weight="500" text-anchor="middle" fill="#a0aec0" letter-spacing="-0.01em">&amp; Data Analyst</text>

  <!-- Iconos reemplazados por paths SVG nativos -->
  <g transform="translate(600, 470)" text-anchor="middle" font-size="22" font-weight="600" fill="#94a3b8">
    <!-- </> - Código -->
    <g transform="translate(-180, 0)">
      <path d="M-10,-8 L-16,0 L-10,8" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-6" y1="-8" x2="-2" y2="8" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M2,-8 L8,0 L2,8" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- BI - Gráfico -->
    <g transform="translate(-55, 0)">
      <polyline points="-14,6 -4,-6 4,2 14,-8" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-14" cy="6" r="2.5" fill="#94a3b8"/>
      <circle cx="-4" cy="-6" r="2.5" fill="#94a3b8"/>
      <circle cx="4" cy="2" r="2.5" fill="#94a3b8"/>
      <circle cx="14" cy="-8" r="2.5" fill="#94a3b8"/>
    </g>
    <!-- Linux - Terminal -->
    <g transform="translate(55, 0)">
      <rect x="-14" y="-12" width="28" height="24" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M-10,-4 L-6,0 L-10,4" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-4" y1="4" x2="6" y2="4" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- SQL - Base de datos -->
    <g transform="translate(180, 0)">
      <ellipse cx="0" cy="-10" rx="12" ry="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M-12,-10 L-12,6 Q0,12 12,6 L12,-10" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M-12,-2 Q0,4 12,-2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M-12,4 Q0,10 12,4" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.6"/>
    </g>
  </g>

  <!-- Textos descriptivos -->
  <g transform="translate(600, 505)" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, system-ui, sans-serif" font-size="12" fill="#cbd5e1">
    <text x="-210" y="0">React · Laravel · Node</text>
    <text x="-60" y="0">Power BI · DAX</text>
    <text x="60" y="0">Linux · Bash · Docker</text>
    <text x="210" y="0">PostgreSQL · MongoDB</text>
  </g>
  <rect x="120" y="527" width="960" height="3" rx="1.5" fill="url(#accent)" opacity="0.7"/>
  <text x="600" y="570" font-family="DejaVu Sans, Liberation Sans, system-ui, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#64748b">darwin.dev · Soluciones técnicas con visión de negocio</text>
  <path d="M80 80 L120 80 L120 120" fill="none" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
  <path d="M1120 80 L1080 80 L1080 120" fill="none" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
  <path d="M80 595 L120 595 L120 555" fill="none" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
  <path d="M1120 595 L1080 595 L1080 555" fill="none" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
</svg>